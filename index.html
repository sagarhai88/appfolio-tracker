<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppFolio Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4f0; --surface:#ffffff; --surface-2:#faf9f6; --line:#e4e1da;
    --text:#1b1a17; --muted:#6b675f; --accent:#1f5f8b; --accent-soft:#e3eef6;
    --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#b4650d; --warn-soft:#fdf0df;
    --bad:#b3261e; --bad-soft:#fbe5e3; --stripe:#f1efe9; --radius:10px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1e2026; --surface-2:#23262d; --line:#30333b;
    --text:#ecebe6; --muted:#9a9890; --accent:#6ab0e0; --accent-soft:#1e3243;
    --ok:#6ccf93; --ok-soft:#1d3528; --warn:#f0a94a; --warn-soft:#3d2c14;
    --bad:#f08a82; --bad-soft:#44201d; --stripe:#262932;
  }}
  :root[data-theme="dark"]{
    --bg:#15161a; --surface:#1e2026; --surface-2:#23262d; --line:#30333b;
    --text:#ecebe6; --muted:#9a9890; --accent:#6ab0e0; --accent-soft:#1e3243;
    --ok:#6ccf93; --ok-soft:#1d3528; --warn:#f0a94a; --warn-soft:#3d2c14;
    --bad:#f08a82; --bad-soft:#44201d; --stripe:#262932;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px}
  header h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
  header .owner{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .today-box{text-align:right;line-height:1.1}
  .today-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .today-date{font-size:22px;font-weight:700;letter-spacing:-.01em}
  @media (max-width:600px){ .today-date{font-size:18px} }
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.small{padding:4px 9px;font-size:13px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--text);border-color:var(--accent)}
  .nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .nav h2{font-size:17px;margin:0;min-width:180px;text-align:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
  .due{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
  .due.over{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  .due.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
  .progress{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
  .progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
  .row{display:flex;align-items:flex-start;gap:12px;padding:10px 6px;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);cursor:pointer;flex:none}
  .row .body{flex:1;min-width:0}
  .row .name{font-weight:500}
  .row.done .name{color:var(--muted);text-decoration:line-through}
  .row .props{color:var(--muted);font-size:12.5px;margin-top:2px}
  .row .note{color:var(--warn);font-size:12.5px;margin-top:2px}
  .row .meta{color:var(--muted);font-size:12px;white-space:nowrap;margin-top:3px}
  .empty{color:var(--muted);padding:14px 6px;font-size:14px}
  /* checklist grid */
  table.grid{width:100%;border-collapse:collapse}
  table.grid th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.grid th.c,table.grid td.c{text-align:center;width:120px}
  table.grid td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.grid tbody tr:nth-child(odd) td{background:var(--stripe)}
  table.grid th.c,table.grid td.c{border-left:1px solid var(--line)}
  table.grid tbody tr:hover td{background:var(--accent-soft)}
  table.grid tr:last-child td{border-bottom:0}
  table.grid td.c input{width:22px;height:22px;accent-color:var(--ok);cursor:pointer;display:block;margin:0 auto}
  table.grid td.c .meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
  table.grid .name{font-weight:500}
  table.grid .props{color:var(--muted);font-size:12px;margin-top:1px}
  table.grid .note{color:var(--warn);font-size:12px;margin-top:1px}
  table.grid tr.alldone .name{color:var(--muted)}
  table.grid th .sub{display:block;font-weight:500;letter-spacing:0;text-transform:none;margin-top:2px}
  table.grid th .selall{display:block;margin:6px auto 0;font-size:11px;padding:2px 7px;text-transform:none;letter-spacing:0;font-weight:500}
  @media (max-width:600px){ table.grid th.c,table.grid td.c{width:70px} table.grid .props{display:none} }
  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
  .cal .day{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px}
  .cal .day.out{opacity:.4}
  .cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .cal .n{color:var(--muted);font-weight:600;margin-bottom:3px}
  .ev{display:block;border-radius:5px;padding:3px 6px;margin-top:3px;font-size:11.5px;line-height:1.3;cursor:pointer;border:1px solid transparent}
  .ev.pending{background:var(--accent-soft);color:var(--accent)}
  .ev.over{background:var(--bad-soft);color:var(--bad)}
  .ev.done{background:var(--ok-soft);color:var(--ok)}
  .legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
  .legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .upcoming{margin-top:14px}
  .upcoming .row{align-items:center}
  /* banner + settings */
  .banner{font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;background:var(--warn-soft);color:var(--warn)}
  .banner.ok{background:var(--ok-soft);color:var(--ok)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:20px;max-width:460px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h2{margin:0 0 12px;font-size:17px}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  dialog input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--text);font:inherit}
  dialog p{font-size:13px;color:var(--muted);margin:8px 0}
  dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  @media (max-width:600px){
    .cal .day{min-height:58px;padding:3px 4px}
    .ev{font-size:10.5px;padding:2px 4px}
    .nav h2{min-width:0;flex:1}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">AppFolio Tracker</h1>
      <div class="owner" id="owner"></div>
    </div>
    <div class="spacer"></div>
    <div class="today-box"><div class="today-label">Today</div><div class="today-date" id="todayDate"></div></div>
    <span id="who" style="font-size:13px;color:var(--muted)"></span>
    <button class="btn" id="settingsBtn">Settings</button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="tabs">
    <div class="tab active" data-view="checklist">Monthly checklist</div>
    <div class="tab" data-view="calendar">Calendar</div>
    <div class="tab" data-view="yearly">Yearly tasks</div>
  </div>

  <div id="view"></div>
</div>

<dialog id="settings">
  <h2>Settings</h2>
  <label>Your name (recorded next to each checkmark)</label>
  <input id="sName" placeholder="e.g. Sagar">
  <label>GitHub token (fine-grained, Contents: read &amp; write on this repo)</label>
  <input id="sToken" type="password" placeholder="github_pat_…">
  <p>The token stays in this browser only. With a token, checkmarks are saved to <code id="sFile"></code> in the repo so everyone sees the same list. Without one, checkmarks stay in this browser.</p>
  <div class="actions">
    <button class="btn" id="sCancel">Cancel</button>
    <button class="btn primary" id="sSave">Save</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
(function(){
  const C = window.TRACKER_CONFIG;
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const ym = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date(); today.setHours(0,0,0,0);

  // ---------- state ----------
  let status = {};            // { "2026-09": { "recon:1280-loop-288": {done,by,at}, ... }, "yearly": { "2026": {...} } }
  let sha = null;             // sha of status.json in repo
  let view = 'checklist';
  let period = (()=>{ const d=new Date(today); d.setMonth(d.getMonth()-1); return ym(d); })(); // default: last month
  let calMonth = ym(today);
  let year = today.getFullYear();
  const ls = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
  const name = () => ls.get('tracker.name') || '';
  const token = () => ls.get('tracker.token') || '';
  const synced = () => !!(C.sync && C.sync.repo && token());

  // ---------- GitHub sync ----------
  const api = () => `https://api.github.com/repos/${C.sync.repo}/contents/${C.sync.statusFile}?ref=${C.sync.branch||'main'}`;
  const hdrs = () => Object.assign({Accept:'application/vnd.github+json'}, token()?{Authorization:'Bearer '+token()}:{});
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

  async function load(){
    const cached = ls.get('tracker.status'); if(cached){ try{status=JSON.parse(cached)}catch{} }
    if(!(C.sync&&C.sync.repo)) return;
    try{
      const r = await fetch(api(),{headers:hdrs(),cache:'no-store'});
      if(r.status===404){ sha=null; return; }
      if(!r.ok) throw new Error(r.status+' '+r.statusText);
      const j = await r.json(); sha=j.sha; status=JSON.parse(b64dec(j.content)||'{}');
      ls.set('tracker.status',JSON.stringify(status));
      if(token()) banner('Synced with GitHub.','ok',2500);
    }catch(e){ banner('Could not load shared status from GitHub ('+e.message+'). Showing local copy.','bad'); }
  }

  let saveTimer=null, saving=false, dirty=false;
  function queueSave(){ ls.set('tracker.status',JSON.stringify(status)); if(!synced()) return; dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(save,800); }
  async function save(attempt=0){
    if(saving){ dirty=true; return; } saving=true; dirty=false;
    try{
      const body={message:`Update tracker (${name()||'web'})`,content:b64enc(JSON.stringify(status,null,2)),branch:C.sync.branch||'main'};
      if(sha) body.sha=sha;
      const r=await fetch(api().split('?')[0],{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify(body)});
      if(r.status===409||r.status===422){ // sha changed: refetch, merge, retry once
        if(attempt<1){ const cur=await fetch(api(),{headers:hdrs(),cache:'no-store'}).then(x=>x.json()); sha=cur.sha; const remote=JSON.parse(b64dec(cur.content)||'{}'); status=deepMerge(remote,status); saving=false; return save(1); }
        throw new Error('conflict');
      }
      if(!r.ok) throw new Error(r.status+' '+r.statusText);
      const j=await r.json(); sha=j.content.sha; banner('Saved to GitHub.','ok',2000);
    }catch(e){ banner('Save to GitHub failed ('+e.message+'). Your checkmark is kept locally — try again later.','bad'); }
    finally{ saving=false; if(dirty) queueSave(); }
  }
  function deepMerge(a,b){ const o=Object.assign({},a); for(const k in b){ o[k]=(b[k]&&typeof b[k]==='object'&&!('done' in b[k]))?deepMerge(a[k]||{},b[k]):b[k]; } return o; }

  let bannerTimer=null;
  function banner(msg,kind='',ms){ const b=$('#banner'); b.textContent=msg; b.className='banner '+kind; b.hidden=false; clearTimeout(bannerTimer); if(ms) bannerTimer=setTimeout(()=>b.hidden=true,ms); }

  // ---------- helpers ----------
  const get = (p,k) => (status[p]||{})[k];
  function setDone(p,k,done){ if(C.sync&&C.sync.repo&&!token()) banner('Saved in this browser only — add your GitHub token in Settings so the team sees it.','',6000); status[p]=status[p]||{}; if(done) status[p][k]={done:true,by:name(),at:new Date().toISOString()}; else delete status[p][k]; queueSave(); render(); }
  function dueDate(task,p){ if(p.startsWith('yearly-')){ const y=Number(p.slice(7)); return new Date(y,Number(task.dueDate.slice(0,2))-1,Number(task.dueDate.slice(3))); } const [y,m]=p.split('-').map(Number); const mm=m-1+(task.followingMonth?1:0); return task.dueDay==='last'?new Date(y,mm+1,0):new Date(y,mm,task.dueDay||1); }
  function startDate(task,p){ if(!task.startDay||p.startsWith('yearly-')) return null; const [y,m]=p.split('-').map(Number); return new Date(y,m-1+(task.followingMonth?1:0),task.startDay); }
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const fmtAt = iso => new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  function periodLabel(p){ const [y,m]=p.split('-').map(Number); return MONTHS[m-1]+' '+y; }
  function shift(p,n){ const [y,m]=p.split('-').map(Number); return ym(new Date(y,m-1+n,1)); }
  function keysFor(task){ return task.perBank ? C.banks.map(b=>({key:task.id+':'+b.id,bank:b})) : [{key:task.id}]; }
  function taskStatus(task,p){ const ks=keysFor(task); const done=ks.filter(k=>get(p,k.key)).length; const d=dueDate(task,p); return {done,total:ks.length,complete:done===ks.length,due:d,overdue:d<today&&done<ks.length}; }

  // ---------- views ----------
  function render(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
    $('#who').textContent = name() ? 'Checking as '+name() : 'No name set';
    ({checklist:renderChecklist,calendar:renderCalendar,yearly:renderYearly})[view]();
  }

  function rowHtml(p,key,label,sub,note,checked){
    const s=get(p,key);
    return `<label class="row ${s?'done':''}"><input type="checkbox" data-p="${p}" data-k="${key}" ${s?'checked':''}>
      <div class="body"><div class="name">${label}</div>${sub?`<div class="props">${sub}</div>`:''}${note?`<div class="note">⚠ ${note}</div>`:''}</div>
      ${s?`<div class="meta">${s.by?s.by+' · ':''}${fmtAt(s.at)}</div>`:''}</label>`;
  }

  function gridHtml(p,tasks){
    let tot=0,don=0; const cols=tasks.map(task=>{ const st=taskStatus(task,p); tot+=st.total; don+=st.done; return {task,st}; });
    let html=`<div class="progress"><i style="width:${tot?100*don/tot:0}%"></i></div><div style="font-size:13px;color:var(--muted);margin:-8px 0 14px">${don} of ${tot} items complete</div>`;
    const pb=cols.filter(c=>c.task.perBank);
    if(pb.length){
      html+=`<div class="card" style="padding:6px 10px"><table class="grid"><thead><tr><th>Bank account</th>`;
      for(const {task,st} of pb){ const cls=st.complete?'done':st.overdue?'over':''; const sd=startDate(task,p); html+=`<th class="c">${task.label.replace('bank account','')}<span class="sub"><span class="due ${cls}">${st.complete?'Complete':(st.overdue?'Overdue · ':'')+(sd&&!st.overdue?fmt(sd)+'–'+st.due.getDate():'Due '+fmt(st.due))}</span></span><button class="btn small selall" data-task="${task.id}" data-all="${st.complete?0:1}">${st.complete?'Clear all':'Select all'}</button></th>`; }
      html+=`</tr></thead><tbody>`;
      for(const b of C.banks){
        const all=pb.every(({task})=>get(p,task.id+':'+b.id));
        html+=`<tr class="${all?'alldone':''}"><td><div class="name">${b.name}</div><div class="props">${b.properties.join(' · ')}</div>${b.note?`<div class="note">⚠ ${b.note}</div>`:''}</td>`;
        for(const {task} of pb){ const k=task.id+':'+b.id; const st=get(p,k); html+=`<td class="c"><input type="checkbox" data-p="${p}" data-k="${k}" ${st?'checked':''}>${st?`<div class="meta">${st.by?st.by+' · ':''}${fmtAt(st.at)}</div>`:''}</td>`; }
        html+=`</tr>`;
      }
      html+=`</tbody></table></div>`;
    }
    const extra=cols.filter(c=>!c.task.perBank);
    if(extra.length){ html+=`<div class="card"><h3>${p.startsWith('yearly-')?'Other':'Month-end'}</h3>`; for(const {task,st} of extra){ const cls=st.complete?'done':st.overdue?'over':''; html+=rowHtml(p,task.id,task.label,`<span class="due ${cls}">${st.complete?'Complete':(st.overdue?'Overdue · ':'Due ')+fmt(st.due)}</span>`,''); } html+=`</div>`; }
    if(!tasks.length) html+=`<div class="card"><div class="empty">No tasks configured yet — add them in <code>config.js</code>.</div></div>`;
    return html;
  }
  function bindGrid(p){
    document.querySelectorAll('.selall').forEach(btn=>btn.onclick=()=>{ const all=btn.dataset.all==='1'; const t=btn.dataset.task; status[p]=status[p]||{}; for(const b of C.banks){ const k=t+':'+b.id; if(all) status[p][k]={done:true,by:name(),at:new Date().toISOString()}; else delete status[p][k]; } if(C.sync&&C.sync.repo&&!token()) banner('Saved in this browser only — add your GitHub token in Settings so the team sees it.','',6000); queueSave(); render(); });
    bindChecks();
  }

  function renderChecklist(){
    const p=period;
    let html=`<div class="nav"><button class="btn small" id="prev">‹</button><h2>${periodLabel(p)}</h2><button class="btn small" id="next">›</button><div class="spacer"></div><button class="btn small" id="thisMonth">Last month</button></div>`;
    html+=gridHtml(p,C.monthly);
    $('#view').innerHTML=html;
    $('#prev').onclick=()=>{period=shift(period,-1);render()}; $('#next').onclick=()=>{period=shift(period,1);render()};
    $('#thisMonth').onclick=()=>{period=shift(ym(today),-1);render()};
    bindGrid(p);
  }

  function renderYearly(){
    const p='yearly-'+year;
    let html=`<div class="nav"><button class="btn small" id="prev">‹</button><h2>${year}</h2><button class="btn small" id="next">›</button></div>`;
    html+=gridHtml(p,C.yearly);
    $('#view').innerHTML=html;
    $('#prev').onclick=()=>{year--;render()}; $('#next').onclick=()=>{year++;render()};
    bindGrid(p);
  }

  function eventsIn(cm){ // all deadlines landing in calendar month cm
    const [y,m]=cm.split('-').map(Number); const evs=[];
    for(const task of C.monthly){ for(const off of [0,-1,-2]){ const p=shift(cm,off); const d=dueDate(task,p); if(d.getFullYear()===y&&d.getMonth()===m-1){ const st=taskStatus(task,p); const sd=startDate(task,p); const first=sd?sd.getDate():d.getDate(); const short=task.label.replace(/ bank account| GL/,'');
      for(let day=first;day<=d.getDate();day++){ evs.push({day,isDue:day===d.getDate(),label:`${day===first?task.label.replace('bank account','banks'):short} – ${MONTHS[Number(p.slice(5))-1].slice(0,3)}${task.perBank?` (${st.done}/${st.total})`:''}`,cls:st.complete?'done':st.overdue?'over':'pending',go:()=>{view='checklist';period=p;render()}}); } } } }
    for(const t of C.yearly){ if(Number(t.dueDate.slice(0,2))===m){ const p='yearly-'+y; const st=taskStatus(t,p); evs.push({day:st.due.getDate(),isDue:true,label:`${t.label}${t.perBank?` (${st.done}/${st.total})`:''}`,cls:st.complete?'done':st.overdue?'over':'pending',go:()=>{view='yearly';year=y;render()}}); } }
    return evs;
  }

  function renderCalendar(){
    const [y,m]=calMonth.split('-').map(Number); const first=new Date(y,m-1,1); const start=first.getDay(); const days=new Date(y,m,0).getDate(); const prevDays=new Date(y,m-1,0).getDate();
    const evs=eventsIn(calMonth); const byDay={}; evs.forEach((e,i)=>{(byDay[e.day]=byDay[e.day]||[]).push(i)});
    let html=`<div class="nav"><button class="btn small" id="prev">‹</button><h2>${MONTHS[m-1]} ${y}</h2><button class="btn small" id="next">›</button><div class="spacer"></div><button class="btn small" id="thisMonth">Today</button></div><div class="cal">`;
    for(const d of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']) html+=`<div class="dow">${d}</div>`;
    for(let i=0;i<start;i++) html+=`<div class="day out"><div class="n">${prevDays-start+1+i}</div></div>`;
    for(let d=1;d<=days;d++){ const isT=today.getFullYear()===y&&today.getMonth()===m-1&&today.getDate()===d; html+=`<div class="day ${isT?'today':''}"><div class="n">${d}</div>${(byDay[d]||[]).map(i=>`<span class="ev ${evs[i].cls}" data-ev="${i}">${evs[i].label}</span>`).join('')}</div>`; }
    const tail=(7-(start+days)%7)%7; for(let i=1;i<=tail;i++) html+=`<div class="day out"><div class="n">${i}</div></div>`;
    html+=`</div><div class="legend"><span><b style="background:var(--accent)"></b>Upcoming</span><span><b style="background:var(--bad)"></b>Overdue</span><span><b style="background:var(--ok)"></b>Complete</span></div>`;
    // upcoming list (next 60 days)
    const up=[]; for(let off=0;off<3;off++){ const cm=shift(ym(today),off); eventsIn(cm).forEach(e=>{ const d=new Date(Number(cm.slice(0,4)),Number(cm.slice(5))-1,e.day); if(e.cls!=='done'&&e.isDue!==false&&d<=new Date(today.getTime()+60*864e5)) up.push({e,d}); }); }
    up.sort((a,b)=>a.d-b.d);
    html+=`<div class="card upcoming"><h3>Open deadlines – next 60 days</h3>${up.length?up.map(({e,d})=>`<div class="row"><span class="due ${e.cls==='over'?'over':''}" style="min-width:64px;text-align:center">${fmt(d)}</span><div class="body"><div class="name">${e.label}</div></div></div>`).join(''):'<div class="empty">Nothing open. 🎉</div>'}</div>`;
    $('#view').innerHTML=html;
    $('#prev').onclick=()=>{calMonth=shift(calMonth,-1);render()}; $('#next').onclick=()=>{calMonth=shift(calMonth,1);render()}; $('#thisMonth').onclick=()=>{calMonth=ym(today);render()};
    document.querySelectorAll('.ev').forEach(el=>el.onclick=()=>evs[Number(el.dataset.ev)].go());
  }

  function bindChecks(){ document.querySelectorAll('input[type=checkbox][data-k]').forEach(cb=>cb.onchange=()=>setDone(cb.dataset.p,cb.dataset.k,cb.checked)); }

  // ---------- settings ----------
  const dlg=$('#settings');
  $('#settingsBtn').onclick=()=>{ $('#sName').value=name(); $('#sToken').value=token(); $('#sFile').textContent=(C.sync&&C.sync.repo)?C.sync.repo+'/'+C.sync.statusFile:'(sync.repo not set)'; dlg.showModal(); };
  $('#sCancel').onclick=()=>dlg.close();
  $('#sSave').onclick=async()=>{ ls.set('tracker.name',$('#sName').value.trim()); ls.set('tracker.token',$('#sToken').value.trim()); dlg.close(); await load(); render(); };
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});

  // ---------- init ----------
  $('#title').textContent=C.title; document.title=C.title; $('#owner').textContent=C.owner; $('#todayDate').textContent=today.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'});
  render(); load().then(render);
})();
</script>
</body>
</html>
